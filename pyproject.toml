[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[project]
name = "beanapp"
version = "1.0.0"
description = "A collection of utilities for building basic desktop apps."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Wyatt Rosinski" },
]
requires-python = ">=3.11"
keywords = ["utilities", "desktop", "config", "prompting", "modes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2"
]

[project.urls]
Homepage = "https://github.com/Beansyboy221/BeanApp"
Source = "https://github.com/Beansyboy221/BeanApp"
Documentation = "https://github.com/Beansyboy221/BeanApp/blob/main/docs/usage.md"
Bug_Tracker = "https://github.com/Beansyboy221/BeanApp/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


